<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Courier New', Consolas, monospace">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="ivory" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8f8470"/>
      <stop offset="0.35" stop-color="#f1e9d8"/>
      <stop offset="0.6" stop-color="#e0d6c3"/>
      <stop offset="1" stop-color="#6e6454"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ccb066"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#090909"/>
  <rect width="900" height="470" fill="url(#dots)"/>

  <text x="30" y="36" fill="#ccb066" font-size="13" font-weight="700" letter-spacing="3">NO 3D MODELS: PIECES ARE SPUN ON A VIRTUAL LATHE</text>

  <!-- step labels -->
  <g fill="#ccb066" font-size="11" font-weight="700" letter-spacing="2">
    <text x="90" y="80">1. A LIST OF POINTS</text>
    <text x="600" y="80">3. THE FINISHED PAWN</text>
  </g>
  <text x="370" y="80" fill="#ccb066" font-size="11" font-weight="700" letter-spacing="2">2. SPIN IT</text>

  <!-- left: profile -->
  <line x1="210" y1="95" x2="210" y2="410" stroke="#555" stroke-dasharray="5 5"/>
  <text x="210" y="428" fill="#666" font-size="10" text-anchor="middle">axis of rotation</text>
  <line x1="150" y1="390" x2="300" y2="390" stroke="#2f2f2f"/>

  <!-- profile polyline (pixels: x = 210 + r, y = 390 - h) -->
  <polyline fill="none" stroke="#ccb066" stroke-width="2"
    points="210,390 280,390 280,380 270,368 258,356 240,332 232,282 244,262 244,252 232,242 246,220 246,196 232,170 210,162"/>
  <g fill="#090909" stroke="#ccb066" stroke-width="1.6">
    <circle cx="280" cy="390" r="3.5"/><circle cx="280" cy="380" r="3.5"/>
    <circle cx="270" cy="368" r="3.5"/><circle cx="258" cy="356" r="3.5"/>
    <circle cx="240" cy="332" r="3.5"/><circle cx="232" cy="282" r="3.5"/>
    <circle cx="244" cy="262" r="3.5"/><circle cx="244" cy="252" r="3.5"/>
    <circle cx="232" cy="242" r="3.5"/><circle cx="246" cy="220" r="3.5"/>
    <circle cx="246" cy="196" r="3.5"/><circle cx="232" cy="170" r="3.5"/>
  </g>
  <g fill="#777" font-size="10">
    <text x="296" y="394">(0.35, 0)</text>
  </g>
  <text x="150" y="130" fill="#888" font-size="10.5">each point is</text>
  <text x="150" y="144" fill="#888" font-size="10.5">(radius, height)</text>

  <!-- middle arrow -->
  <path d="M330 280 H470" stroke="#ccb066" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="400" y="268" fill="#ccb066" font-size="11" text-anchor="middle">LatheGeometry</text>
  <text x="400" y="304" fill="#888" font-size="10" text-anchor="middle">32 segments around</text>

  <!-- right: finished pawn silhouette (center x = 650) -->
  <path fill="url(#ivory)" stroke="#ccb066" stroke-opacity="0.5"
    d="M580,390 L580,380 L590,368 L602,356 L620,332 L628,282 L616,262 L616,252 L628,242 L614,220 L614,196 L628,170 L650,162 L672,170 L686,196 L686,220 L672,242 L684,252 L684,262 L672,282 L680,332 L698,356 L710,368 L720,380 L720,390 Z"/>
  <!-- lathe rings -->
  <g fill="none" stroke="#000" stroke-opacity="0.22">
    <ellipse cx="650" cy="390" rx="70" ry="9"/>
    <ellipse cx="650" cy="356" rx="48" ry="7"/>
    <ellipse cx="650" cy="332" rx="30" ry="5"/>
    <ellipse cx="650" cy="282" rx="22" ry="4"/>
    <ellipse cx="650" cy="242" rx="22" ry="4"/>
    <ellipse cx="650" cy="196" rx="36" ry="6"/>
  </g>
  <ellipse cx="650" cy="392" rx="76" ry="10" fill="#000" fill-opacity="0.35"/>
  <path d="M650 162 m-34 8 a34 34 0 0 1 68 0" fill="none"/>

  <!-- bottom notes -->
  <text x="450" y="448" fill="#666" font-size="10.5" text-anchor="middle">Pawn, rook, bishop, queen and king bases all start like this.</text>
  <text x="450" y="463" fill="#666" font-size="10.5" text-anchor="middle">Heads, crowns and crosses are spheres, cylinders and boxes on top. The knight's head is an extruded outline.</text>
</svg>
