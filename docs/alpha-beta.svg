<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Courier New', Consolas, monospace">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="900" height="500" fill="#090909"/>
  <rect width="900" height="500" fill="url(#dots)"/>

  <text x="30" y="36" fill="#ccb066" font-size="13" font-weight="700" letter-spacing="3">ALPHA-BETA PRUNING ON A TINY TREE</text>

  <!-- level labels -->
  <g fill="#555" font-size="10" letter-spacing="1.5">
    <text x="30" y="74">YOUR MOVE (MAX)</text>
    <text x="30" y="204">REPLY (MIN)</text>
    <text x="30" y="344">LEAVES</text>
  </g>

  <!-- edges root -> A,B,C -->
  <g stroke="#666" stroke-width="1.5" fill="none">
    <path d="M450 92 L190 180"/>
    <path d="M450 92 L450 180"/>
    <path d="M450 92 L710 180"/>
  </g>
  <!-- edges A -->
  <g stroke="#666" stroke-width="1.5" fill="none">
    <path d="M190 222 L120 322"/><path d="M190 222 L190 322"/><path d="M190 222 L260 322"/>
  </g>
  <!-- edges B: first leaf live, rest pruned -->
  <path d="M450 222 L380 322" stroke="#666" stroke-width="1.5" fill="none"/>
  <g stroke="#444" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M450 222 L450 322"/><path d="M450 222 L520 322"/>
  </g>
  <!-- edges C -->
  <g stroke="#666" stroke-width="1.5" fill="none">
    <path d="M710 222 L640 322"/><path d="M710 222 L710 322"/><path d="M710 222 L780 322"/>
  </g>

  <!-- cut marker on B -->
  <path d="M425 270 L475 270" stroke="#ff5a4d" stroke-width="2.5"/>
  <text x="450" y="262" fill="#ff5a4d" font-size="11" font-weight="700" text-anchor="middle">CUT</text>

  <!-- root -->
  <rect x="418" y="54" width="64" height="38" fill="#161616" stroke="#ccb066" stroke-width="1.6"/>
  <text x="450" y="78" fill="#ccb066" font-size="16" font-weight="700" text-anchor="middle">3</text>

  <!-- MIN nodes -->
  <g fill="#161616" stroke="#aaa" stroke-width="1.5">
    <circle cx="190" cy="200" r="22"/>
    <circle cx="450" cy="200" r="22" stroke="#ff5a4d"/>
    <circle cx="710" cy="200" r="22"/>
  </g>
  <g fill="#fff" font-size="15" font-weight="700" text-anchor="middle">
    <text x="190" y="206">3</text>
    <text x="450" y="206" fill="#ff5a4d">&#8804;2</text>
    <text x="710" y="206">2</text>
  </g>

  <!-- leaves -->
  <g fill="#161616" stroke="#aaa" stroke-width="1.5">
    <rect x="100" y="322" width="40" height="36"/>
    <rect x="170" y="322" width="40" height="36"/>
    <rect x="240" y="322" width="40" height="36"/>
    <rect x="360" y="322" width="40" height="36"/>
    <rect x="620" y="322" width="40" height="36"/>
    <rect x="690" y="322" width="40" height="36"/>
    <rect x="760" y="322" width="40" height="36"/>
  </g>
  <g fill="#161616" stroke="#444" stroke-width="1.5" stroke-dasharray="4 3">
    <rect x="430" y="322" width="40" height="36"/>
    <rect x="500" y="322" width="40" height="36"/>
  </g>
  <g fill="#ddd" font-size="14" font-weight="700" text-anchor="middle">
    <text x="120" y="346">3</text><text x="190" y="346">12</text><text x="260" y="346">8</text>
    <text x="380" y="346">2</text>
    <text x="640" y="346">14</text><text x="710" y="346">5</text><text x="780" y="346">2</text>
  </g>
  <g fill="#555" font-size="14" font-weight="700" text-anchor="middle">
    <text x="450" y="346">4</text><text x="520" y="346">6</text>
  </g>
  <text x="485" y="376" fill="#555" font-size="10" text-anchor="middle">never searched</text>

  <!-- annotations -->
  <rect x="30" y="410" width="840" height="64" fill="#0e0e0e" stroke="#2a2a2a"/>
  <path d="M30 422 V410 H42" stroke="#ccb066" fill="none"/>
  <path d="M870 462 V474 H858" stroke="#ccb066" fill="none"/>
  <g font-size="11.5">
    <text x="48" y="432" fill="#ddd"><tspan fill="#ccb066" font-weight="700">1.</tspan> Left branch finishes first: the opponent's best reply is worth 3, so we are guaranteed at least 3 (alpha = 3).</text>
    <text x="48" y="451" fill="#ddd"><tspan fill="#ff5a4d" font-weight="700">2.</tspan> Middle branch: the first reply is already 2, which is worse than 3. Nothing it holds can fix that, so skip the rest.</text>
    <text x="48" y="468" fill="#ddd"><tspan fill="#ccb066" font-weight="700">3.</tspan> Right branch has to be checked in full, since 14 and 5 look great until the last leaf says 2. Best move = left.</text>
  </g>
</svg>
